<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buffon's Needle WASM</title>
    <style>

    </style>
</head>
<body>
  <script type="module">
    const wasm = await WebAssembly.instantiateStreaming(fetch('./buffon.wasm'));
    const buffon = wasm.instance.exports;

    const pi_half = Math.PI / 2;
    for (let i=0; i < 10; i++) {
      const val = i * pi_half / 10;
      console.log(buffon.sin(val) + " : " + Math.sin(val));
    }
  </script>
</body>
</html>
