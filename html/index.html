<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buffon's Needle WASM</title>
</head>
<body>
  <input type="number" id="throws" value="1000">
  <button id="run">Run Simulation</button>
  <div id="output"></div>

  <script type="module">
    const wasm = await WebAssembly.instantiateStreaming(fetch('./buffon.wasm'));
    const buffon = wasm.instance.exports;

    const output = document.getElementById("output");
    document.getElementById("run").addEventListener("click", () => {
      const throws = parseInt(document.getElementById("throws").value);
      document.getElementById("output").textContent = buffon.run_simulation(throws);
    });
  </script>
</body>
</html>
